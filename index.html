<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main">
      <div class="left">
        <div class="logo">
          <div class="transparent">
            <img src="assets/odin-lined.png" height="120px" alt="odin" />
            <h1>Odin</h1>
          </div>
        </div>
      </div>
      <div class="right">
        <div class="first">
          <h2>
            This is not a real online service! You know you need something like
            this in your
            <br />
            life to help you realize your deepest dreams. Sign up
            <em>now</em> to get started. <br />
            <br />
            You <em>know</em> you want to.
          </h2>
        </div>
        <div class="second">
          <h2 style="margin-bottom: 30px; margin-left: 55px; margin-top: 15px">
            Let's do this!
          </h2>
          <form action="" method="get" class="main-form">
            <div class="form-divs">
              <div class="form-div">
                <label for="name">First Name</label>
                <input type="text" id="name" />
              </div>

              <div class="form-div">
                <label for="email">Email</label>
                <input type="email" id="email" />
              </div>

              <div class="form-div">
                <label for="pwd">Password</label>
                <input type="password" id="pwd" required />
              </div>
            </div>

            <div class="form-divs">
              <div class="form-div">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" />
              </div>

              <div class="form-div">
                <label for="phone-num">Phone Number</label>
                <input type="tel" id="phone-num" />
              </div>

              <div class="form-div">
                <label for="con-pwd">Confirm Password</label>
                <input type="password" id="con-pwd" required />
              </div>
            </div>
          </form>
        </div>
        <div class="third">
          <button>Create Account</button>
        </div>
        <div class="already">
          Already have an account? <a><b>Log in</b></a>
        </div>
      </div>
    </div>
  </body>
</html>
